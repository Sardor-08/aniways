services:
  backend:
    build: ./backend
    container_name: aniways-backend
    ports:
      - "4444:4444"
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - DEBUG=false
      - DATA_DIR=/app/data
    volumes:
      - aniways-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: aniways-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:4444
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aniways-data:
